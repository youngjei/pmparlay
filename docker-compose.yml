x-production-config: &production-config
  RATE_LIMIT_BACKEND: redis
  RATE_LIMIT_SKIP_ON_REDIS_ERROR: "false"
  POLYGON_SETTLEMENT_CHAIN_ID: ${POLYGON_SETTLEMENT_CHAIN_ID:-137}
  SETTLEMENT_RPC_QUORUM: ${SETTLEMENT_RPC_QUORUM:-2}
  POLYGON_RPC_URL: ${POLYGON_RPC_URL:-}
  POLYGON_RPC_OPERATOR: ${POLYGON_RPC_OPERATOR:-}
  POLYGON_SECONDARY_RPC_URL: ${POLYGON_SECONDARY_RPC_URL:-}
  POLYGON_SECONDARY_RPC_OPERATOR: ${POLYGON_SECONDARY_RPC_OPERATOR:-}
  POLYGON_TERTIARY_RPC_URL: ${POLYGON_TERTIARY_RPC_URL:-}
  POLYGON_TERTIARY_RPC_OPERATOR: ${POLYGON_TERTIARY_RPC_OPERATOR:-}
  USDC_REQUIRED_CONFIRMATIONS: ${USDC_REQUIRED_CONFIRMATIONS:-12}
  OPS_API_KEY: ${OPS_API_KEY:?OPS_API_KEY is required}

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legwork-migrate
    profiles: ["app", "worker"]
    command: ["sh", "-c", "npm run db:migrate && npm run db:backfill-settlement-identities"]
    environment:
      <<: *production-config
      NODE_ENV: production
      ACCOUNTING_MODE: house_book_usdc
      LEDGER_CURRENCY: USDC
      DATABASE_URL: postgres://legwork:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/legwork
      REDIS_URL: redis://redis:6379
      SETTLEMENT_CHAIN_ID: ${SETTLEMENT_CHAIN_ID:-11155111}
      TREASURY_SAFE_ADDRESS: ${TREASURY_SAFE_ADDRESS:-}
      USDC_CONTRACT_ADDRESS: ${USDC_CONTRACT_ADDRESS:-0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      SETTLEMENT_REQUIRE_ONCHAIN: ${SETTLEMENT_REQUIRE_ONCHAIN:-true}
      SETTLEMENT_AUTHORITY: ${SETTLEMENT_AUTHORITY:-polygon_ctf}
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legwork-api
    profiles: ["app"]
    restart: unless-stopped
    environment:
      <<: *production-config
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8787
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      ACCOUNTING_MODE: house_book_usdc
      LEDGER_CURRENCY: USDC
      DATABASE_URL: postgres://legwork:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/legwork
      REDIS_URL: redis://redis:6379
      SETTLEMENT_CHAIN_ID: ${SETTLEMENT_CHAIN_ID:-11155111}
      TREASURY_SAFE_ADDRESS: ${TREASURY_SAFE_ADDRESS:-}
      USDC_CONTRACT_ADDRESS: ${USDC_CONTRACT_ADDRESS:-0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      SETTLEMENT_REQUIRE_ONCHAIN: ${SETTLEMENT_REQUIRE_ONCHAIN:-true}
      SETTLEMENT_AUTHORITY: ${SETTLEMENT_AUTHORITY:-polygon_ctf}
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
      SAFE_API_BASE_URL: ${SAFE_API_BASE_URL:-https://api.safe.global}
      SAFE_API_KEY: ${SAFE_API_KEY:-}
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  market-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legwork-market-worker
    profiles: ["worker"]
    restart: unless-stopped
    command: ["npm", "run", "start:worker:markets"]
    environment:
      <<: *production-config
      NODE_ENV: production
      ACCOUNTING_MODE: house_book_usdc
      LEDGER_CURRENCY: USDC
      DATABASE_URL: postgres://legwork:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/legwork
      REDIS_URL: redis://redis:6379
      SETTLEMENT_CHAIN_ID: ${SETTLEMENT_CHAIN_ID:-11155111}
      TREASURY_SAFE_ADDRESS: ${TREASURY_SAFE_ADDRESS:-}
      USDC_CONTRACT_ADDRESS: ${USDC_CONTRACT_ADDRESS:-0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      SETTLEMENT_REQUIRE_ONCHAIN: ${SETTLEMENT_REQUIRE_ONCHAIN:-true}
      SETTLEMENT_AUTHORITY: ${SETTLEMENT_AUTHORITY:-polygon_ctf}
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
      MARKET_INDEX_INTERVAL_MS: ${MARKET_INDEX_INTERVAL_MS:-60000}
      MARKET_INDEX_MAX_PAGES: ${MARKET_INDEX_MAX_PAGES:-1}
      MARKET_INDEX_JOB_TIMEOUT_MS: ${MARKET_INDEX_JOB_TIMEOUT_MS:-120000}
      WORKER_HEARTBEAT_FILE: /tmp/legwork-market-worker.heartbeat
      WORKER_HEARTBEAT_MAX_AGE_MS: 45000
      WORKER_SUCCESS_MAX_AGE_MS: 180000
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "npm", "run", "worker:health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  outbox-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legwork-outbox-worker
    profiles: ["worker"]
    restart: unless-stopped
    command: ["npm", "run", "start:worker:outbox"]
    environment:
      <<: *production-config
      NODE_ENV: production
      ACCOUNTING_MODE: house_book_usdc
      LEDGER_CURRENCY: USDC
      DATABASE_URL: postgres://legwork:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/legwork
      REDIS_URL: redis://redis:6379
      SETTLEMENT_CHAIN_ID: ${SETTLEMENT_CHAIN_ID:-11155111}
      TREASURY_SAFE_ADDRESS: ${TREASURY_SAFE_ADDRESS:-}
      USDC_CONTRACT_ADDRESS: ${USDC_CONTRACT_ADDRESS:-0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      SETTLEMENT_REQUIRE_ONCHAIN: ${SETTLEMENT_REQUIRE_ONCHAIN:-true}
      SETTLEMENT_AUTHORITY: ${SETTLEMENT_AUTHORITY:-polygon_ctf}
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
      WORKER_HEARTBEAT_FILE: /tmp/legwork-outbox-worker.heartbeat
      WORKER_HEARTBEAT_MAX_AGE_MS: 45000
      WORKER_SUCCESS_MAX_AGE_MS: 180000
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "npm", "run", "worker:health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  settlement-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legwork-settlement-worker
    profiles: ["worker"]
    restart: unless-stopped
    command: ["npm", "run", "start:worker:settlements"]
    environment:
      <<: *production-config
      NODE_ENV: production
      ACCOUNTING_MODE: house_book_usdc
      LEDGER_CURRENCY: USDC
      DATABASE_URL: postgres://legwork:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/legwork
      REDIS_URL: redis://redis:6379
      SETTLEMENT_CHAIN_ID: ${SETTLEMENT_CHAIN_ID:-11155111}
      TREASURY_SAFE_ADDRESS: ${TREASURY_SAFE_ADDRESS:-}
      USDC_CONTRACT_ADDRESS: ${USDC_CONTRACT_ADDRESS:-0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
      SETTLEMENT_REQUIRE_ONCHAIN: ${SETTLEMENT_REQUIRE_ONCHAIN:-true}
      SETTLEMENT_AUTHORITY: ${SETTLEMENT_AUTHORITY:-polygon_ctf}
      WORKER_HEARTBEAT_FILE: /tmp/legwork-settlement-worker.heartbeat
      WORKER_HEARTBEAT_MAX_AGE_MS: 45000
      WORKER_SUCCESS_MAX_AGE_MS: 180000
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "npm", "run", "worker:health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  deposit-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legwork-deposit-worker
    profiles: ["worker"]
    restart: unless-stopped
    command: ["npm", "run", "start:worker:deposits"]
    environment:
      <<: *production-config
      NODE_ENV: production
      ACCOUNTING_MODE: house_book_usdc
      LEDGER_CURRENCY: USDC
      DATABASE_URL: postgres://legwork:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/legwork
      REDIS_URL: redis://redis:6379
      SETTLEMENT_CHAIN_ID: ${SETTLEMENT_CHAIN_ID:-11155111}
      TREASURY_SAFE_ADDRESS: ${TREASURY_SAFE_ADDRESS:-}
      USDC_CONTRACT_ADDRESS: ${USDC_CONTRACT_ADDRESS:-0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238}
      USDC_DEPOSIT_START_BLOCK: ${USDC_DEPOSIT_START_BLOCK:-}
      USDC_DEPOSIT_SCAN_LOOKBACK_BLOCKS: ${USDC_DEPOSIT_SCAN_LOOKBACK_BLOCKS:-5000}
      USDC_DEPOSIT_SCAN_BATCH_BLOCKS: ${USDC_DEPOSIT_SCAN_BATCH_BLOCKS:-2000}
      USDC_DEPOSIT_POLL_INTERVAL_MS: ${USDC_DEPOSIT_POLL_INTERVAL_MS:-30000}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      SETTLEMENT_REQUIRE_ONCHAIN: ${SETTLEMENT_REQUIRE_ONCHAIN:-true}
      SETTLEMENT_AUTHORITY: ${SETTLEMENT_AUTHORITY:-polygon_ctf}
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
      WORKER_HEARTBEAT_FILE: /tmp/legwork-deposit-worker.heartbeat
      WORKER_HEARTBEAT_MAX_AGE_MS: 45000
      WORKER_SUCCESS_MAX_AGE_MS: 180000
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
