      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  reconciliation-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legwork-reconciliation-worker
    profiles: ["worker"]
    restart: unless-stopped
    command: ["npm", "run", "start:worker:reconciliation"]
    environment:
      <<: *production-config
      NODE_ENV: production
      ACCOUNTING_MODE: house_book_usdc
      LEDGER_CURRENCY: USDC
      DATABASE_URL: postgres://legwork:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/legwork
      REDIS_URL: redis://redis:6379
      SETTLEMENT_CHAIN_ID: ${SETTLEMENT_CHAIN_ID:-11155111}
      TREASURY_SAFE_ADDRESS: ${TREASURY_SAFE_ADDRESS:-}
      USDC_CONTRACT_ADDRESS: ${USDC_CONTRACT_ADDRESS:-0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
      RECONCILIATION_POLL_INTERVAL_MS: ${RECONCILIATION_POLL_INTERVAL_MS:-60000}
      WORKER_HEARTBEAT_FILE: /tmp/legwork-reconciliation-worker.heartbeat
      WORKER_HEARTBEAT_MAX_AGE_MS: 45000
      WORKER_SUCCESS_MAX_AGE_MS: 180000
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "npm", "run", "worker:health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: legwork-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: legwork
      POSTGRES_USER: legwork
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - legwork-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legwork -d legwork"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: legwork-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - legwork-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  legwork-postgres-data:
  legwork-redis-data:
