name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: legwork_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d legwork_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit

      - name: Typecheck and build frontend
        run: npm run build

      - name: Frontend bundle budgets
        run: npm run qa:frontend-bundle

      - name: Typecheck API
        run: npm run typecheck:api

      - name: Run database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/legwork_test

      - name: Unit tests
        run: npm run test:unit

      - name: PostgreSQL integration tests
        run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/legwork_test
          DIRECT_PAY_MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/legwork_test

      - name: Market database performance regression
        run: npm run qa:market-performance:ci
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/legwork_test
          MARKET_QA_MAX_DB_LATENCY_MS: 2500

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Wallet runtime E2E tests
        run: npm run test:e2e:wallet

      - name: Build API container
        run: docker build -t legwork-ci .

      - name: Smoke-test production container
        run: |
          ops_api_key="$(openssl rand -hex 32)"
          docker run -d --name legwork-ci-runtime --network host \
            -e PORT=8790 \
            -e ACCOUNTING_MODE=house_book_usdc \
            -e LEDGER_CURRENCY=USDC \
            -e DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/legwork_test \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            -e RATE_LIMIT_BACKEND=redis \
            -e RATE_LIMIT_SKIP_ON_REDIS_ERROR=false \
            -e SETTLEMENT_AUTHORITY=polymarket_api \
            -e TREASURY_SAFE_ADDRESS=0x1d4Fd58d9fC24c9F3C8dA0dEB4A05E7d122ef17B \
            -e ETHEREUM_RPC_URL=http://127.0.0.1:8545 \
            -e PRIVY_APP_ID=ci-smoke-test \
            -e OPS_API_KEY="$ops_api_key" \
            legwork-ci
          trap 'docker logs legwork-ci-runtime; docker rm -f legwork-ci-runtime' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8790/healthz > /dev/null; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8790/ > /dev/null
          curl --fail --silent http://127.0.0.1:8790/favicon.svg > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8790/api/not-a-route)" = "404"

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
