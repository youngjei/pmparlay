name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: legwork_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d legwork_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

      - name: Frontend bundle budgets
        run: npm run qa:frontend-bundle

      - name: Typecheck API
        run: npm run typecheck:api

      - name: Run database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/legwork_test

      - name: Unit tests
        run: npm run test:unit

      - name: PostgreSQL integration tests
        run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/legwork_test
          DIRECT_PAY_MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/legwork_test

      - name: Market database performance regression
        run: npm run qa:market-performance:ci
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/legwork_test
          MARKET_QA_MAX_DB_LATENCY_MS: 2500

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Wallet runtime E2E tests
        run: npm run test:e2e:wallet

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build API container
        run: docker build -f Dockerfile.api .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
