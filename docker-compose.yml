services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: legwork-migrate
    profiles: ["app", "worker"]
    command: ["npm", "run", "db:migrate"]
    environment:
      NODE_ENV: production
      ACCOUNTING_MODE: house_book_usdc
      LEDGER_CURRENCY: USDC
      DATABASE_URL: postgres://legwork:legwork_dev_password@postgres:5432/legwork
      REDIS_URL: redis://redis:6379
      BETA_USER_API_KEY: local_dev_beta_key
      SETTLEMENT_CHAIN_ID: ${SETTLEMENT_CHAIN_ID:-11155111}
      TREASURY_SAFE_ADDRESS: ${TREASURY_SAFE_ADDRESS:-}
      USDC_CONTRACT_ADDRESS: ${USDC_CONTRACT_ADDRESS:-0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      SETTLEMENT_REQUIRE_ONCHAIN: ${SETTLEMENT_REQUIRE_ONCHAIN:-true}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-}
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: legwork-api
    profiles: ["app"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8787
      WEB_ORIGIN: http://localhost:5173
      ACCOUNTING_MODE: house_book_usdc
      LEDGER_CURRENCY: USDC
      DATABASE_URL: postgres://legwork:legwork_dev_password@postgres:5432/legwork
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_BACKEND: redis
      RATE_LIMIT_SKIP_ON_REDIS_ERROR: "false"
      BETA_USER_API_KEY: local_dev_beta_key
      SETTLEMENT_CHAIN_ID: ${SETTLEMENT_CHAIN_ID:-11155111}
      TREASURY_SAFE_ADDRESS: ${TREASURY_SAFE_ADDRESS:-}
      USDC_CONTRACT_ADDRESS: ${USDC_CONTRACT_ADDRESS:-0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      SETTLEMENT_REQUIRE_ONCHAIN: ${SETTLEMENT_REQUIRE_ONCHAIN:-true}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-}
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
      OPS_API_KEY: ${OPS_API_KEY:-}
    ports:
      - "8787:8787"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  market-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: legwork-market-worker
    profiles: ["worker"]
    restart: unless-stopped
    command: ["npm", "run", "start:worker:markets"]
    environment:
      NODE_ENV: production
      ACCOUNTING_MODE: house_book_usdc
      LEDGER_CURRENCY: USDC
      DATABASE_URL: postgres://legwork:legwork_dev_password@postgres:5432/legwork
      REDIS_URL: redis://redis:6379
      BETA_USER_API_KEY: local_dev_beta_key
      SETTLEMENT_CHAIN_ID: ${SETTLEMENT_CHAIN_ID:-11155111}
      TREASURY_SAFE_ADDRESS: ${TREASURY_SAFE_ADDRESS:-}
      USDC_CONTRACT_ADDRESS: ${USDC_CONTRACT_ADDRESS:-0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      SETTLEMENT_REQUIRE_ONCHAIN: ${SETTLEMENT_REQUIRE_ONCHAIN:-true}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-}
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
      WORKER_HEARTBEAT_FILE: /tmp/legwork-market-worker.heartbeat
      WORKER_HEARTBEAT_MAX_AGE_MS: 45000
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "npm", "run", "worker:health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  outbox-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: legwork-outbox-worker
    profiles: ["worker"]
    restart: unless-stopped
    command: ["npm", "run", "start:worker:outbox"]
    environment:
      NODE_ENV: production
      ACCOUNTING_MODE: house_book_usdc
      LEDGER_CURRENCY: USDC
      DATABASE_URL: postgres://legwork:legwork_dev_password@postgres:5432/legwork
      REDIS_URL: redis://redis:6379
      BETA_USER_API_KEY: local_dev_beta_key
      SETTLEMENT_CHAIN_ID: ${SETTLEMENT_CHAIN_ID:-11155111}
      TREASURY_SAFE_ADDRESS: ${TREASURY_SAFE_ADDRESS:-}
      USDC_CONTRACT_ADDRESS: ${USDC_CONTRACT_ADDRESS:-0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      SETTLEMENT_REQUIRE_ONCHAIN: ${SETTLEMENT_REQUIRE_ONCHAIN:-true}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-}
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
      WORKER_HEARTBEAT_FILE: /tmp/legwork-outbox-worker.heartbeat
      WORKER_HEARTBEAT_MAX_AGE_MS: 45000
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "npm", "run", "worker:health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  settlement-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: legwork-settlement-worker
    profiles: ["worker"]
    restart: unless-stopped
    command: ["npm", "run", "start:worker:settlements"]
    environment:
      NODE_ENV: production
      ACCOUNTING_MODE: house_book_usdc
      LEDGER_CURRENCY: USDC
      DATABASE_URL: postgres://legwork:legwork_dev_password@postgres:5432/legwork
      REDIS_URL: redis://redis:6379
      BETA_USER_API_KEY: local_dev_beta_key
      SETTLEMENT_CHAIN_ID: ${SETTLEMENT_CHAIN_ID:-11155111}
      TREASURY_SAFE_ADDRESS: ${TREASURY_SAFE_ADDRESS:-}
      USDC_CONTRACT_ADDRESS: ${USDC_CONTRACT_ADDRESS:-0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
      SETTLEMENT_REQUIRE_ONCHAIN: ${SETTLEMENT_REQUIRE_ONCHAIN:-true}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-}
      WORKER_HEARTBEAT_FILE: /tmp/legwork-settlement-worker.heartbeat
      WORKER_HEARTBEAT_MAX_AGE_MS: 45000
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "npm", "run", "worker:health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  deposit-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: legwork-deposit-worker
    profiles: ["worker"]
    restart: unless-stopped
    command: ["npm", "run", "start:worker:deposits"]
    environment:
      NODE_ENV: production
      ACCOUNTING_MODE: house_book_usdc
      LEDGER_CURRENCY: USDC
      DATABASE_URL: postgres://legwork:legwork_dev_password@postgres:5432/legwork
      REDIS_URL: redis://redis:6379
      BETA_USER_API_KEY: local_dev_beta_key
      SETTLEMENT_CHAIN_ID: ${SETTLEMENT_CHAIN_ID:-11155111}
      TREASURY_SAFE_ADDRESS: ${TREASURY_SAFE_ADDRESS:-}
      USDC_CONTRACT_ADDRESS: ${USDC_CONTRACT_ADDRESS:-0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238}
      USDC_REQUIRED_CONFIRMATIONS: ${USDC_REQUIRED_CONFIRMATIONS:-3}
      USDC_DEPOSIT_START_BLOCK: ${USDC_DEPOSIT_START_BLOCK:-}
      USDC_DEPOSIT_SCAN_LOOKBACK_BLOCKS: ${USDC_DEPOSIT_SCAN_LOOKBACK_BLOCKS:-5000}
      USDC_DEPOSIT_SCAN_BATCH_BLOCKS: ${USDC_DEPOSIT_SCAN_BATCH_BLOCKS:-2000}
      USDC_DEPOSIT_POLL_INTERVAL_MS: ${USDC_DEPOSIT_POLL_INTERVAL_MS:-30000}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      SETTLEMENT_REQUIRE_ONCHAIN: ${SETTLEMENT_REQUIRE_ONCHAIN:-true}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-}
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
      WORKER_HEARTBEAT_FILE: /tmp/legwork-deposit-worker.heartbeat
      WORKER_HEARTBEAT_MAX_AGE_MS: 45000
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "npm", "run", "worker:health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: legwork-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: legwork
      POSTGRES_USER: legwork
      POSTGRES_PASSWORD: legwork_dev_password
    ports:
      - "5432:5432"
    volumes:
      - legwork-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legwork -d legwork"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: legwork-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - legwork-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  legwork-postgres-data:
  legwork-redis-data:
